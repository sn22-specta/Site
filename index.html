<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot IA - Connecté</title>
    <style>
        /* --- RESET ET FOND --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #e0e0e0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; 
            touch-action: none; 
            perspective: 1000px; 
        }

        /* --- UI DE CHAT (En bas) --- */
        .chat-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .chat-input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .chat-input:focus {
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            background-color: #fff;
        }

        .chat-btn {
            padding: 0 20px;
            border-radius: 30px;
            border: none;
            background-color: #333;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chat-btn:active { transform: scale(0.95); }
        .chat-btn:disabled { background-color: #999; cursor: not-allowed; }

        /* --- BULLE DE DIALOGUE DU ROBOT --- */
        .speech-bubble {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background-color: #fff;
            color: #333;
            padding: 15px 25px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
            z-index: 200;
            pointer-events: none;
        }

        /* Petite flèche de la bulle */
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
        }

        .speech-bubble.show {
            transform: translateX(-50%) scale(1);
        }

        /* --- LE RECTANGLE NOIR --- */
        .rectangle-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 440px; 
            height: 240px;
            background-color: #050505;
            border-radius: 70px; 
            box-shadow: 0px 15px 25px rgba(0,0,0,0.4), inset 0px 0px 25px rgba(0,0,0,1);
            overflow: hidden;
            cursor: grab; 
            transform-style: preserve-3d;
        }

        .rectangle-screen:active { cursor: grabbing; }

        .face-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px; 
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        .rectangle-screen::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 30px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.08), transparent);
            border-radius: 50%;
            pointer-events: none; 
            z-index: 50;
        }

        .eye-area {
            width: 170px; 
            height: 170px;
            border-radius: 50%;
            position: relative;
            overflow: hidden; 
            pointer-events: none; 
            transform-style: preserve-3d;
            animation: breathe 3.5s ease-in-out infinite;
        }
        .eye-area:nth-child(2) { animation-delay: 0.2s; }

        .eye-inner {
            width: 100%;
            height: 100%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .eye-ball {
            width: 140px; 
            height: 140px;
            background-color: #e6e6e6;
            border-radius: 50%;
            position: absolute;
            z-index: 1;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        .pupil {
            width: 85px; 
            height: 85px;
            background-color: #b3ff00; 
            border-radius: 50%;
            box-shadow: inset -4px -4px 10px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
            transition: background-color 0.3s, box-shadow 0.3s, width 0.3s, height 0.3s, clip-path 0.3s, transform 0.1s;
        }

        .hover-attentive .pupil { width: 95px; height: 95px; }

        .eyelid {
            position: absolute;
            background: linear-gradient(to bottom, #333333, #0a0a0a);
            width: 200%; 
            height: 150%; 
            border-radius: 50%; 
            z-index: 10;
            transition: top 0.15s ease-in-out;
            box-shadow: 0px 8px 15px rgba(0,0,0,0.6);
        }

        .lid-top { top: -95%; left: -50%; transform-origin: center; }

        .blush {
            position: absolute; width: 50px; height: 25px;
            background: radial-gradient(ellipse, rgba(255, 80, 120, 0.7) 0%, transparent 70%);
            border-radius: 50%; filter: blur(3px); opacity: 0;
            transition: opacity 0.3s ease; z-index: 3; bottom: 0px;
        }
        .blush.left { left: -10px; }
        .blush.right { right: -10px; }
        .show-blush .blush { opacity: 1; }

        /* Sharingan */
        .sharingan { width: 100%; height: 100%; border-radius: 50%; position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 0.3s ease; z-index: 5; animation: spin 4s linear infinite; }
        .sharingan-bg { width: 100%; height: 100%; background-color: #d40000; border-radius: 50%; }
        .sharingan::before { content: ''; position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; border: 4px solid #000; border-radius: 50%; box-sizing: border-box; }
        .sharingan::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 25%; height: 25%; background-color: #000; border-radius: 50%; }
        .tomoe { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; transform: translate(-50%, -50%); }
        .tomoe::before, .tomoe::after, .tomoe-div { content: ''; position: absolute; width: 18px; height: 18px; background-color: #000; border-radius: 50% 0 50% 50%; top: 10%; left: 50%; transform-origin: 0% 400%; }
        .tomoe::before { transform: rotate(0deg) translate(-50%, 0); }
        .tomoe::after { transform: rotate(120deg) translate(-50%, 0); }
        .tomoe-div { transform: rotate(240deg) translate(-50%, 0); }

        /* États */
        .state-normal .lid-top { top: -95%; }
        .state-happy .lid-top { top: -75%; }
        .state-sleepy .lid-top { top: -20%; } 
        .state-sharingan .sharingan { opacity: 1; }
        .state-sharingan .lid-top { top: -90%; }
        .state-angry .lid-top { top: -75%; transform: rotate(15deg); }
        .state-angry .pupil { background-color: #ff3333; }

        .state-love .pupil { background-color: transparent; box-shadow: none; display: flex; justify-content: center; align-items: center; animation: heartbeat 0.8s infinite alternate; }
        .state-love .pupil::before, .state-love .pupil::after { content: ''; position: absolute; width: 40px; height: 65px; background: #ff3366; border-radius: 40px 40px 0 0; box-shadow: 0 0 20px #ff3366; }
        .state-love .pupil::before { left: 42px; transform: rotate(-45deg); transform-origin: 0 100%; }
        .state-love .pupil::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }

        .state-dizzy .pupil { animation: dizzySpin 0.4s linear infinite; background-color: #ffaa00; }
        .state-dizzy .lid-top { animation: flutter 0.1s infinite alternate; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes heartbeat { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }
        @keyframes dizzySpin { 0% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(10px, -5px) rotate(180deg); } 100% { transform: translate(0, 0) rotate(360deg); } }
        @keyframes flutter { 0% { top: -95%; } 100% { top: -80%; } }
        
        @media (max-width: 480px) {
            .rectangle-screen { transform: translate(-50%, -50%) scale(0.8); }
        }
    </style>
</head>
<body>

    <!-- Zone de Chat -->
    <div class="chat-container">
        <input type="text" id="chatInput" class="chat-input" placeholder="Dis quelque chose au robot..." autocomplete="off">
        <button id="sendBtn" class="chat-btn">Envoyer</button>
    </div>

    <!-- Le Robot -->
    <div class="rectangle-screen state-normal" id="robot">
        <div class="speech-bubble" id="speechBubble">Bonjour !</div>
        
        <div class="face-content" id="faceContent">
            <div class="eye-area">
                <div class="eye-inner">
                    <div class="eye-ball">
                        <div class="blush left"></div>
                        <div class="pupil" id="pupil-left">
                            <div class="sharingan"><div class="sharingan-bg"></div><div class="tomoe"><div class="tomoe-div"></div></div></div>
                        </div>
                    </div>
                    <div class="eyelid lid-top" id="lid-left"></div>
                </div>
            </div>
            
            <div class="eye-area">
                <div class="eye-inner">
                    <div class="eye-ball">
                        <div class="blush right"></div>
                        <div class="pupil" id="pupil-right">
                            <div class="sharingan"><div class="sharingan-bg"></div><div class="tomoe"><div class="tomoe-div"></div></div></div>
                        </div>
                    </div>
                    <div class="eyelid lid-top" id="lid-right"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION DE L'IA (À MODIFIER)
        // ==========================================
        // Mets ta clé API OpenAI ici (attention, ne publie jamais ce code avec la clé !)
        const OPENAI_API_KEY = "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"; 
        const USE_SIMULATION = true; // Passe à FALSE si tu as mis ta vraie clé API

        const robot = document.getElementById('robot');
        const faceContent = document.getElementById('faceContent');
        const speechBubble = document.getElementById('speechBubble');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        
        // ... (Le reste des variables d'animation existantes) ...
        const pupils = document.querySelectorAll('.pupil');
        const eyeBalls = document.querySelectorAll('.eye-ball');
        const lids = document.querySelectorAll('.lid-top');
        
        let pointerX = window.innerWidth / 2;
        let pointerY = window.innerHeight / 2;
        let currentX = 0, currentY = 0, saccadeX = 0, saccadeY = 0;
        let lastInteractionTime = Date.now();
        let isSleeping = false, isDizzy = false, isSneezing = false;
        let isDragging = false, hasMoved = false;
        let dragStartX, dragStartY, initialRobotLeft, initialRobotTop;

        // --- FONCTION DE DIALOGUE ---
        function showBubble(text) {
            speechBubble.textContent = text;
            speechBubble.classList.add('show');
            // La bulle disparaît après 5 secondes
            setTimeout(() => {
                speechBubble.classList.remove('show');
            }, 5000);
        }

        // --- FONCTION POUR CHANGER L'ÉMOTION ---
        function setEmotion(emotion) {
            // On retire tous les états
            robot.className = 'rectangle-screen';
            // On applique le nouvel état
            robot.classList.add('state-' + emotion);
            
            if (emotion === 'happy' || emotion === 'love') {
                robot.classList.add('show-blush');
            }
        }

        // --- APPEL À L'API OPENAI ---
        async function askAI(message) {
            if (USE_SIMULATION) {
                // Mode simulation (sans clé API, pour tester l'interface)
                return new Promise(resolve => {
                    setTimeout(() => {
                        const responses = [
                            { text: "Je suis un robot !", emotion: "normal" },
                            { text: "Haha, c'est très drôle !", emotion: "happy" },
                            { text: "Je commence à être fatigué...", emotion: "sleepy" },
                            { text: "Tu me cherches ?!", emotion: "angry" },
                            { text: "Oh, j'ai un peu tourné de l'œil...", emotion: "dizzy" },
                            { text: "Je t'aime bien tu sais.", emotion: "love" }
                        ];
                        // Choisit une réponse aléatoire
                        const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                        resolve(randomResponse);
                    }, 1000); // Fait semblant de réfléchir pendant 1s
                });
            }

            // Vrai appel API (si USE_SIMULATION = false)
            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini", // Modèle rapide et pas cher
                        messages: [
                            { 
                                role: "system", 
                                content: "Tu es un petit robot mignon avec des yeux néons. Réponds de façon courte (max 10 mots). Tu dois obligatoirement renvoyer un objet JSON avec deux clés : 'text' (ta réponse) et 'emotion' (choisis parmi : normal, happy, sleepy, angry, love, dizzy, sharingan)." 
                            },
                            { role: "user", content: message }
                        ],
                        response_format: { type: "json_object" }
                    })
                });

                const data = await response.json();
                const aiResponse = JSON.parse(data.choices[0].message.content);
                return aiResponse;
                
            } catch (error) {
                console.error("Erreur API:", error);
                return { text: "Je n'ai pas accès à internet...", emotion: "sleepy" };
            }
        }

        // --- ENVOI DU MESSAGE ---
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Désactive l'input pendant la réflexion
            chatInput.value = "";
            chatInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.textContent = "...";

            // Le robot fait une tête de réflexion
            setEmotion('thinking');
            
            // Demande à l'IA
            const aiResponse = await askAI(message);
            
            // Affiche la réponse
            showBubble(aiResponse.text);
            setEmotion(aiResponse.emotion);

            // Réactive l'input
            chatInput.disabled = false;
            sendBtn.disabled = false;
            sendBtn.textContent = "Envoyer";
            chatInput.focus();
            
            lastInteractionTime = Date.now();
        }

        // Écouteurs sur l'input
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // --- (Le reste de ton code de drag & drop, respiration, etc. reste identique) ---
        function animate() {
            // Détection du sommeil (seulement si on ne tape pas)
            if (Date.now() - lastInteractionTime > 10000 && !isSleeping && !document.activeElement === chatInput) {
                isSleeping = true;
                setEmotion('sleepy');
                lids.forEach(lid => lid.style.top = '-20%'); 
            }

            eyeBalls.forEach((ball, index) => {
                const rect = ball.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let targetX = 0, targetY = 0;
                const maxMove = 24; 

                if (!isSleeping && !isDizzy) {
                    if (document.activeElement === chatInput) {
                        // Quand on tape, le robot regarde l'input
                        targetX = -15; // Regarde en bas
                        targetY = 15;
                    } else {
                        const deltaX = pointerX - centerX;
                        const deltaY = pointerY - centerY;
                        targetX = Math.max(-maxMove, Math.min(maxMove, deltaX / 15));
                        targetY = Math.max(-maxMove, Math.min(maxMove, deltaY / 15));
                    }
                }

                if (!isSleeping && !isDizzy && Math.random() < 0.05) {
                    saccadeX = (Math.random() - 0.5) * 1.5; 
                    saccadeY = (Math.random() - 0.5) * 1.5;
                }

                currentX += ((targetX + saccadeX) - currentX) * 0.15;
                currentY += ((targetY + saccadeY) - currentY) * 0.15;

                if (!robot.classList.contains('state-love') && !isDizzy) {
                    pupils[index].style.transform = `translate(${currentX}px, ${currentY}px)`;
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
